packages:
  - 'apps/*'
  - 'packages/*'

# Shared tool versions. Packages reference these with `catalog:` so a bump
# happens in exactly one place.
catalog:
  '@types/node': ^22.19.0
  '@types/react': ^19.3.3
  '@types/react-dom': ^19.3.0
  react: ^19.3.1
  react-dom: ^19.3.1
  tsdown: ^0.23.7
  typescript: ^7.0.2
  vitest: ^5.1.2

allowBuilds:
  esbuild: true
  msw: false
  tsdown: false

minimumReleaseAgeExclude:
  - '@oxlint-tsgolint/darwin-arm64@7.0.2009'
  - '@oxlint-tsgolint/darwin-x64@7.0.2009'
  - '@oxlint-tsgolint/linux-arm64@7.0.2009'
  - '@oxlint-tsgolint/linux-x64@7.0.2009'
  - '@oxlint-tsgolint/win32-arm64@7.0.2009'
  - '@oxlint-tsgolint/win32-x64@7.0.2009'
  - oxlint-tsgolint@7.0.2009
  - vite@8.4.0

permissions:
  tsdown:
    skills: false
